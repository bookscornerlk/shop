<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14192e" />
      <stop offset="100%" stop-color="#080b16" />
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35e69a" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>

    <linearGradient id="mateTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#6c63ff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)" />

  <!-- Ambient Backlight -->
  <circle cx="400" cy="230" r="140" fill="#6c63ff" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="430" cy="210" r="100" fill="#00d4ff" opacity="0.15" filter="url(#softGlow)" />

  <!-- LOGO MARK / ICON -->
  <g transform="translate(0, -10)">
    <!-- Outer Shield / Hexagon Frame (Structure & Security) -->
    <path d="M 400 100 
             L 490 150 
             L 490 260 
             L 400 310 
             L 310 260 
             L 310 150 Z" 
          fill="none" 
          stroke="url(#secondaryGrad)" 
          stroke-width="3" 
          opacity="0.3" 
          stroke-dasharray="8 6" />

    <!-- Abstract "M" - Left Wing (Growth & Ascent) -->
    <path d="M 320 270 
             L 320 160 
             C 320 145, 335 135, 350 145 
             L 400 185 
             L 400 225 
             L 355 190 
             L 355 270 Z" 
          fill="url(#primaryGrad)" 
          filter="url(#glow)" />

    <!-- Abstract "M" - Right Wing (Future & Digital) -->
    <path d="M 480 270 
             L 480 160 
             C 480 145, 465 135, 450 145 
             L 400 185 
             L 400 225 
             L 445 190 
             L 445 270 Z" 
          fill="url(#secondaryGrad)" 
          filter="url(#glow)" />

    <!-- Central Glowing Core / Graduation Cap Peak (Achievement) -->
    <polygon points="400,140 435,165 400,190 365,165" fill="url(#accentGrad)" filter="url(#glow)" />

    <!-- Orbital AI Tech Dots -->
    <circle cx="310" cy="150" r="5" fill="#00d4ff" filter="url(#glow)" />
    <circle cx="490" cy="150" r="5" fill="#6c63ff" filter="url(#glow)" />
    <circle cx="400" cy="310" r="6" fill="#35e69a" filter="url(#glow)" />
    
    <!-- Connection Lines -->
    <line x1="310" y1="150" x2="285" y2="135" stroke="#00d4ff" stroke-width="2" opacity="0.5" />
    <circle cx="280" cy="132" r="3" fill="#00d4ff" opacity="0.7" />

    <line x1="490" y1="150" x2="515" y2="135" stroke="#6c63ff" stroke-width="2" opacity="0.5" />
    <circle cx="520" cy="132" r="3" fill="#6c63ff" opacity="0.7" />
  </g>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle">
    <!-- Brand Name -->
    <text x="400" y="425" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="52" letter-spacing="2">
      <tspan fill="url(#textGrad)">MICO</tspan>
      <tspan fill="url(#mateTextGrad)">MATE</tspan>
    </text>

    <!-- Tagline -->
    <text x="400" y="465" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#8d96b2" letter-spacing="8">
      SMART O/L DASHBOARD
    </text>

    <!-- Decorative Accent Line -->
    <rect x="360" y="490" width="80" height="3" rx="1.5" fill="url(#accentGrad)" />
  </g>
</svg>
